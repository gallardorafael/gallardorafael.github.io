<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1d1d1b;
      --muted: #6b6a66;
      --link: #1f5fa8;
      --rule: #e3e1db;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --fg: #e6e4de;
        --muted: #9a988f;
        --link: #8ab4e8;
        --rule: #2c2b28;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    main {
      max-width: 68ch;
      margin: 0 auto;
      padding: 4rem 1rem 6rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    h2 {
      font-size: 1rem;
      margin: 2.5rem 0 .75rem;
      color: var(--muted);
      font-weight: normal;
    }
    h2::before { content: "## "; }
    a { color: var(--link); text-underline-offset: 2px; }
    ul { padding-left: 1.25rem; }
    li { margin: .35rem 0; }
    li::marker { content: "- "; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
